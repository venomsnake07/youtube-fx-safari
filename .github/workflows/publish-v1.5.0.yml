name: Publish YouTube FX v1.5.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v1.5.0.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release
        run: |
          node --test tests/*.test.cjs
          (cd . && sha256sum -c macos/extension-files.sha256)
      - name: Package Safari extension and personal Mac installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          assert json.loads(Path('manifest.json').read_text())['version'] == '1.5.0'
          files = [p for p in Path('.').rglob('*') if p.is_file() and not any(part.startswith('.') for part in p.parts)]
          with ZipFile('YouTube-FX-Safari-v1.5.0.zip', 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(files):
                  z.write(p, p.as_posix())
          PY
          cat > release-notes.md <<'NOTES'
          Linked sample-rate playback, independent speed/pitch, and precise +/− controls for YouTube and YouTube Music.

          - Sample rate 50–200%: at 95%, tempo and pitch both drop naturally.
          - Link/unlink toggle reveals separate speed and pitch controls.
          - +/− buttons beside every slider.
          - Stereo processing with no additional lossy encoding; linked mode bypasses spectral pitch shifting.
          - Variable-speed buffered playback with speed-adjusted reserve and latency compensation.
          - Personal Mac app installer included. Building/signing requires Xcode and a valid Apple Development identity; this is not a pre-signed or notarized app.

          Download **YouTube-FX-Safari-v1.5.0.zip** under Assets. For temporary installation, load the extracted extension folder in Safari. For the personal Mac app, follow PERMANENT-INSTALL.md and run INSTALL-ON-MAC.command. Reload every YouTube tab and confirm v1.5.0.

          Validation: 137 automated checks and 38 WebKit checks passed before release. Native macOS Safari listening and app signing remain to be tested on a Mac. VALIDATION.md details the Linux media-backend limitations and test shims.
          NOTES
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.0 YouTube-FX-Safari-v1.5.0.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'YouTube FX for Safari v1.5.0' --latest --notes-file release-notes.md
